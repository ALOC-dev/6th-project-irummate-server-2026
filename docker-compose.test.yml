# 테스트 서버용 (AWS EC2 + PostgreSQL)
# 실행:
# docker compose --env-file .env.test -f docker-compose.test.yml up -d

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: irummate-test-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_USERNAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/aloc-dev/irummate-server:test
    container_name: irummate-test-app
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "127.0.0.1:8080:8080"

    environment:
      TZ: Asia/Seoul

      JAVA_TOOL_OPTIONS: >-
        -Duser.timezone=Asia/Seoul
        -Xms128m
        -Xmx512m

      DB_URL: jdbc:postgresql://postgres:5432/${DB_USERNAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      CLOUD_AWS_S3_BUCKET: ${CLOUD_AWS_S3_BUCKET}
      CLOUD_AWS_REGION: ${CLOUD_AWS_REGION:-ap-northeast-2}

      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI}
      KAKAO_ADMIN_KEY: ${KAKAO_ADMIN_KEY}

      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION:-3600000}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION:-1209600000}

      HASHIDS_SALT: ${HASHIDS_SALT}
      HASHIDS_MIN_LENGTH: ${HASHIDS_MIN_LENGTH:-8}

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    container_name: irummate-test-nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx-test/conf.d:/etc/nginx/conf.d:ro
      - ./certbot-www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

    depends_on:
      - app

    command: >-
      /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done
      & nginx -g 'daemon off;'"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: certbot/certbot
    container_name: irummate-test-certbot
    restart: unless-stopped

    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - ./certbot-www:/var/www/certbot

    entrypoint: >-
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot
      -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

volumes:
  postgres_test_data: