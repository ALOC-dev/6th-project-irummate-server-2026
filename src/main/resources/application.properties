spring.application.name=irummate

# spring boot .env?(?? ? ??)
spring.config.import=optional:file:.env[.properties]

# PostgreSQL ??
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# DB POOL
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.max-lifetime=1700000

# HTTP ?? ?? ???
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100

# HTTPS
server.forward-headers-strategy=framework

# kakao
kakao.client-id=${KAKAO_CLIENT_ID}
kakao.client-secret=${KAKAO_CLIENT_SECRET}
kakao.redirect-uri=${KAKAO_REDIRECT_URI}
kakao.admin-key=${KAKAO_ADMIN_KEY}

#security
logging.level.org.springframework.security=INFO

jwt.secret=${JWT_SECRET}


# S3
cloud.aws.s3.bucket=irummate-s3-bucket
cloud.aws.region=ap-northeast-2


# HashIds
hashids.salt=${HASHIDS_SALT}
hashids.minlength=${HASHIDS_MIN_LENGTH}
