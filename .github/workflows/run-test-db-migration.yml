name: Run Test DB Migration

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-2

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TEST_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run migration on test EC2
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.TEST_EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Run test DB auth policy migration" \
            --parameters '{"commands":[
              "sudo -u ubuntu bash -lc '\''cd /home/ubuntu/irummate-server && git fetch origin && git switch test && git pull --ff-only origin test && DB_USERNAME=$(grep ^DB_USERNAME= .env.test | cut -d= -f2-) && docker exec -i irummate-test-postgres psql -U \"$DB_USERNAME\" -d \"$DB_USERNAME\" < migration-auth-policy.sql'\''"
            ]}' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.TEST_EC2_INSTANCE_ID }}"

          echo "===== STDOUT ====="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.TEST_EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" \
            --output text

          echo "===== STDERR ====="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.TEST_EC2_INSTANCE_ID }}" \
            --query "StandardErrorContent" \
            --output text
