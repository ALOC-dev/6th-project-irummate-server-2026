# ============================================================
# irummate CI/CD — 빌드는 Actions, 서버는 이미지 pull만
# 배포는 SSM Run Command 사용 (SSH/22번 포트 불필요)
#
# 필요한 GitHub Secrets:
#   AWS_ACCESS_KEY_ID     = CI/CD용 IAM 사용자 키
#   AWS_SECRET_ACCESS_KEY = CI/CD용 IAM 사용자 시크릿
#   EC2_INSTANCE_ID       = i-로 시작하는 인스턴스 ID
# ============================================================
name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/aloc-dev/irummate-server

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build jar
        run: |
          chmod +x gradlew
          ./gradlew bootJar

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      # ── 여기부터가 교체된 부분 ──────────────────────────

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Deploy via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${{ github.sha }}" \
            --parameters '{"commands":[
              "sudo -u ubuntu bash -c \"cd /home/ubuntu/irummate-server && docker compose -f docker-compose.prod.yml pull app && docker compose -f docker-compose.prod.yml up -d && docker image prune -f\""
            ]}' \
            --query "Command.CommandId" --output text)

          echo "Command ID: $COMMAND_ID"

          # 완료 대기 (실패하면 이 스텝도 실패 처리됨)
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} || DEPLOY_FAILED=true

          # 실행 로그 출력 (성공/실패 모두)
          echo "===== STDOUT ====="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --query "StandardOutputContent" --output text

          echo "===== STDERR ====="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --query "StandardErrorContent" --output text

          if [ "$DEPLOY_FAILED" = "true" ]; then
            echo "Deploy failed"
            exit 1
          fi