plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
	// 엔티티 바이트코드 enhancement: mappedBy @OneToOne(Users.userDetails/userPreferences)도 실제로 지연 로딩
	// Spring Boot가 관리하는 hibernate-core는 7.4.13이지만 플러그인 저장소에 7.4.13이 없어
	// 같은 7.4 계열의 가장 가까운 이전 버전을 사용(빌드 시 enhancement에만 쓰임)
	id 'org.hibernate.orm' version '7.4.10.Final'
}

hibernate {
	// 플러그인이 hibernate-core를 자기 버전으로 바꾸지 않도록 함
	// → 런타임은 Spring Boot가 관리하는 버전(hibernate-vector 등과 동일) 유지
	useSameVersion = false
	enhancement {
		enableLazyInitialization = true
		// 변경 감지 방식은 기존(flush 시 스냅샷 비교) 그대로 유지
		enableDirtyTracking = false
	}
}

group = 'com.irummate'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	awsSdkVersion = '2.57.9'
	springdocVersion = '3.2.0'
}

dependencies {
	// HTTP API / Jackson 3 / 검증 / 채팅
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'

	// 카카오 로그인 / JWT 인증 — Spring Security 포함
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'

	// 기존 토큰과 공개 ID 계약은 구현 전환 전까지 유지한다.
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	implementation 'org.hashids:hashids:1.0.3'

	// PostgreSQL / JPA / 벡터
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.hibernate.orm:hibernate-vector'
	runtimeOnly 'org.postgresql:postgresql'

	// OpenAI
	implementation 'com.openai:openai-java:4.101.0'

	// DB 스키마 변경 이력
	// implementation 'org.springframework.boot:spring-boot-starter-flyway'
	// runtimeOnly 'org.flywaydb:flyway-database-postgresql'

	// S3 / API 문서
	implementation platform("software.amazon.awssdk:bom:${awsSdkVersion}")
	implementation 'software.amazon.awssdk:s3'
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

	// 개발 편의
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// 공통 검증·차단 AOP
	implementation 'org.springframework.boot:spring-boot-starter-aspectj'

	// 공통 테스트 라이브러리를 포함하는 기술별 스타터
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'

	// PostgreSQL 통합 테스트
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'


	// Firebase Cloud Messaging
	implementation 'com.google.firebase:firebase-admin:9.12.0'

	// 캐시 작업용
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'com.github.ben-manes.caffeine:caffeine'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('jar') {
	enabled = false
}
